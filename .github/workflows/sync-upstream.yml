name: Sync upstream

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/vbskycn/iptv.git || true
          git fetch upstream master
          git checkout master
          if git merge upstream/master --allow-unrelated-histories -X theirs -m "chore: sync upstream $(date -u +%F\ %H:%M)"; then
            git push origin master
          else
            echo "merge conflict, skip"; exit 1
          fi
